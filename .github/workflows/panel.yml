name: Rebuild private panel

on:
  push:
    paths:
      - "data/nba_picks.enc"   # pushed from the local NBA refresh
      - "data/nfl_picks.enc"   # pushed from the local NFL refresh
      - "data/mix_picks.enc"   # mixed NBA+NFL combos
      - "data/results.enc"     # results tab
  workflow_dispatch:

concurrency:
  group: daily-predictions   # same group as the daily run so the two never push at once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild panel.html from the encrypted site and NBA picks
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          pip install beautifulsoup4 python-dotenv
          python scripts/build_private.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add panel.html
          git diff --cached --quiet && echo "No changes to commit." && exit 0
          git commit -m "chore: rebuild panel $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
          git pull --rebase origin main
          git push
