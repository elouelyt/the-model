name: Daily Predictions

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC every day
  workflow_dispatch:        # allow manual runs from the Actions tab

concurrency:
  group: daily-predictions  # only one run at a time — prevents Pages deployment collisions
  cancel-in-progress: false # queue new runs rather than cancel in-progress ones

permissions:
  contents: write           # needed to commit index.html back to the repo

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-generate.txt

      - name: Install dependencies
        run: pip install -r requirements-generate.txt

      - name: Check yesterday's results
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python scripts/check_results.py

      - name: Run prediction pipeline
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_html.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Save pipeline outputs before resetting to avoid origin/main overwriting them
          cp index.html /tmp/index_generated.html
          cp data/track_record.json /tmp/track_record_generated.json
          cp -r data/predictions /tmp/predictions_generated
          cp -f data/scores_cache.json /tmp/scores_cache_generated.json 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/index_generated.html index.html
          cp /tmp/track_record_generated.json data/track_record.json
          cp -r /tmp/predictions_generated/. data/predictions/
          cp -f /tmp/scores_cache_generated.json data/scores_cache.json 2>/dev/null || true
          git add index.html || true
          git add data/predictions/ || true
          git add data/track_record.json || true
          git add data/scores_cache.json || true
          git diff --cached --quiet \
            && echo "No changes to commit." \
            || git commit -m "chore: update predictions $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push
