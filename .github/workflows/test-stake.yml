name: Test Stake API

on:
  workflow_dispatch:  # manual trigger only — run from GitHub Actions UI

jobs:
  test-stake-api:
    runs-on: ubuntu-latest
    steps:
      - name: Test GET /sport/tennis/category
        run: |
          echo "============================================================"
          echo "GET /sport/tennis/category"
          echo "============================================================"
          curl -s \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0 (compatible; tennis-ai-test/1.0)" \
            -H "Origin: https://stake.com" \
            -H "Referer: https://stake.com/" \
            "https://odds-data.stake.com/sport/tennis/category" \
            | python3 -m json.tool 2>/dev/null || echo "Failed or non-JSON response"

      - name: GET /odds/46453218-r16p3-r16p4 raw
        run: |
          echo "============================================================"
          echo "GET /odds/46453218-r16p3-r16p4"
          echo "============================================================"
          curl -s \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0 (compatible; tennis-ai-test/1.0)" \
            -H "Origin: https://stake.com" \
            -H "Referer: https://stake.com/" \
            "https://odds-data.stake.com/odds/46453218-r16p3-r16p4" \
            -o /tmp/stake_odds1.json
          python3 -m json.tool /tmp/stake_odds1.json 2>/dev/null || cat /tmp/stake_odds1.json
          echo "--- MARKET OUTCOMES ---"
          python3 -c "import json; d=json.load(open('/tmp/stake_odds1.json')); f=d.get('fixture',d); [print('Market:', m.get('name'), '| specs:', repr(m.get('specifiers')), '| status:', m.get('status'), '\n  Outcomes:', [(o.get('name'), o.get('odds')) for o in m.get('outcomes',[])]) for g in f.get('groups',[]) for m in g.get('markets',[])]" 2>/dev/null || echo "parse error"

      - name: GET /odds/46453677-r16p1-r16p2 raw
        run: |
          echo "============================================================"
          echo "GET /odds/46453677-r16p1-r16p2"
          echo "============================================================"
          curl -s \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0 (compatible; tennis-ai-test/1.0)" \
            -H "Origin: https://stake.com" \
            -H "Referer: https://stake.com/" \
            "https://odds-data.stake.com/odds/46453677-r16p1-r16p2" \
            -o /tmp/stake_odds2.json
          python3 -m json.tool /tmp/stake_odds2.json 2>/dev/null || cat /tmp/stake_odds2.json
          echo "--- MARKET OUTCOMES ---"
          python3 -c "import json; d=json.load(open('/tmp/stake_odds2.json')); f=d.get('fixture',d); [print('Market:', m.get('name'), '| specs:', repr(m.get('specifiers')), '| status:', m.get('status'), '\n  Outcomes:', [(o.get('name'), o.get('odds')) for o in m.get('outcomes',[])]) for g in f.get('groups',[]) for m in g.get('markets',[])]" 2>/dev/null || echo "parse error"

      - name: Test GET /sports (all sports list)
        run: |
          echo "============================================================"
          echo "GET /sports"
          echo "============================================================"
          curl -s \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0 (compatible; tennis-ai-test/1.0)" \
            -H "Origin: https://stake.com" \
            "https://odds-data.stake.com/sports" | python3 -m json.tool 2>/dev/null || echo "Failed or non-JSON response"

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Show commit hash being tested
        run: |
          echo "stake_agent.py HEAD commit:"
          git log --oneline -1 -- src/agents/stake_agent.py
          echo "---"
          grep -n "GET /odds\|GET /fixtures\|market_list\|_extract_winner" src/agents/stake_agent.py | head -20

      - name: Run stake_agent.fetch_stake_odds with sample players
        env:
          STAKE_API_KEY: ${{ secrets.STAKE_API_KEY }}
        run: |
          python - <<'EOF'
          import logging, json, sys
          logging.basicConfig(level=logging.INFO, format="%(levelname)s %(message)s")

          sys.path.insert(0, ".")
          from src.agents.stake_agent import fetch_stake_odds, _get, _is_atp_category

          # Show active ATP fixture slugs so we can test current IDs
          print("\n=== Active ATP fixture slugs ===")
          data = _get("/sport/tennis/category")
          raw_cats = data.get("category", []) if isinstance(data, dict) else (data or [])
          atp_cats = [c for c in raw_cats if _is_atp_category(c)]
          if not atp_cats:
              atp_cats = raw_cats
          for cat in atp_cats[:3]:
              slug = cat.get("slug", "")
              fix_data = _get(f"/sport/tennis/category/{slug}/fixture")
              fixtures = fix_data.get("fixture", []) if isinstance(fix_data, dict) else []
              active = [f for f in fixtures if f.get("status") == "active"]
              for f in active[:3]:
                  print(f"  slug={f.get('slug')}  name={f.get('name')}  competitors={f.get('competitors')}")

          sample_players = [
              "Carlos Alcaraz", "Holger Rune", "Alexander Zverev",
              "Jannik Sinner", "Andrey Rublev", "Casper Ruud",
              "Stefanos Tsitsipas", "Taylor Fritz", "Alex de Minaur",
              "Cameron Norris",
          ]
          print("\n=== fetch_stake_odds() ===")
          odds = fetch_stake_odds(sample_players)
          if odds:
              print(json.dumps(odds, indent=2))
          else:
              print("No Stake odds returned (API unreachable or no matching fixtures)")
          EOF
