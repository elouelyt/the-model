name: Test Stake API

on:
  workflow_dispatch:  # manual trigger only — run from GitHub Actions UI

jobs:
  test-stake-api:
    runs-on: ubuntu-latest
    steps:
      - name: Test GET /sport/tennis/category
        run: |
          echo "============================================================"
          echo "GET /sport/tennis/category"
          echo "============================================================"
          curl -s \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0 (compatible; tennis-ai-test/1.0)" \
            -H "Origin: https://stake.com" \
            -H "Referer: https://stake.com/" \
            "https://odds-data.stake.com/sport/tennis/category" \
            | python3 -m json.tool 2>/dev/null || echo "Failed or non-JSON response"

      - name: Fetch raw fixture JSON - 46453218-r16p3-r16p4
        run: |
          echo "============================================================"
          echo "GET /fixtures/46453218-r16p3-r16p4  (RAW - exact competitor names)"
          echo "============================================================"
          curl -s \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0 (compatible; tennis-ai-test/1.0)" \
            -H "Origin: https://stake.com" \
            -H "Referer: https://stake.com/" \
            "https://odds-data.stake.com/fixtures/46453218-r16p3-r16p4" \
            -o /tmp/stake_fix1.json
          echo "--- FULL RESPONSE (pretty) ---"
          python3 -m json.tool /tmp/stake_fix1.json 2>/dev/null || cat /tmp/stake_fix1.json
          echo ""
          echo "--- COMPETITORS LIST ---"
          python3 -c "import json; d=json.load(open('/tmp/stake_fix1.json')); f=d.get('fixture',d); [print(repr(c)) for c in f.get('competitors',[])]" 2>/dev/null || echo "parse error"
          echo ""
          echo "--- MARKET OUTCOMES (name + odds) ---"
          python3 -c "import json; d=json.load(open('/tmp/stake_fix1.json')); f=d.get('fixture',d); [print('Market:', m.get('name'), '| status:', m.get('status'), '\n  Outcomes:', [(o.get('name'), o.get('odds')) for o in m.get('outcomes',[])]) for g in f.get('groups',[]) for m in g.get('markets',[])]" 2>/dev/null || echo "parse error"

      - name: Fetch raw fixture JSON - 46453677-r16p1-r16p2
        run: |
          echo "============================================================"
          echo "GET /fixtures/46453677-r16p1-r16p2  (RAW - exact competitor names)"
          echo "============================================================"
          curl -s \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0 (compatible; tennis-ai-test/1.0)" \
            -H "Origin: https://stake.com" \
            -H "Referer: https://stake.com/" \
            "https://odds-data.stake.com/fixtures/46453677-r16p1-r16p2" \
            -o /tmp/stake_fix2.json
          echo "--- FULL RESPONSE (pretty) ---"
          python3 -m json.tool /tmp/stake_fix2.json 2>/dev/null || cat /tmp/stake_fix2.json
          echo ""
          echo "--- COMPETITORS LIST ---"
          python3 -c "import json; d=json.load(open('/tmp/stake_fix2.json')); f=d.get('fixture',d); [print(repr(c)) for c in f.get('competitors',[])]" 2>/dev/null || echo "parse error"
          echo ""
          echo "--- MARKET OUTCOMES (name + odds) ---"
          python3 -c "import json; d=json.load(open('/tmp/stake_fix2.json')); f=d.get('fixture',d); [print('Market:', m.get('name'), '| status:', m.get('status'), '\n  Outcomes:', [(o.get('name'), o.get('odds')) for o in m.get('outcomes',[])]) for g in f.get('groups',[]) for m in g.get('markets',[])]" 2>/dev/null || echo "parse error"

      - name: GET /odds/46453218-r16p3-r16p4 (undocumented endpoint - raw JSON)
        run: |
          echo "============================================================"
          echo "GET /odds/46453218-r16p3-r16p4  (raw - no filtering)"
          echo "============================================================"
          curl -s \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0 (compatible; tennis-ai-test/1.0)" \
            -H "Origin: https://stake.com" \
            -H "Referer: https://stake.com/" \
            "https://odds-data.stake.com/odds/46453218-r16p3-r16p4" \
            | python3 -m json.tool 2>/dev/null || echo "Failed or non-JSON response"

      - name: GET /odds/46453677-r16p1-r16p2 (undocumented endpoint - raw JSON)
        run: |
          echo "============================================================"
          echo "GET /odds/46453677-r16p1-r16p2  (raw - no filtering)"
          echo "============================================================"
          curl -s \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0 (compatible; tennis-ai-test/1.0)" \
            -H "Origin: https://stake.com" \
            -H "Referer: https://stake.com/" \
            "https://odds-data.stake.com/odds/46453677-r16p1-r16p2" \
            | python3 -m json.tool 2>/dev/null || echo "Failed or non-JSON response"

      - name: Test GET /sports (all sports list)
        run: |
          echo "============================================================"
          echo "GET /sports"
          echo "============================================================"
          curl -s \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0 (compatible; tennis-ai-test/1.0)" \
            -H "Origin: https://stake.com" \
            "https://odds-data.stake.com/sports" | python3 -m json.tool 2>/dev/null || echo "Failed or non-JSON response"

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run stake_agent.fetch_stake_odds with sample players
        env:
          STAKE_API_KEY: ${{ secrets.STAKE_API_KEY }}
        run: |
          python - <<'EOF'
          import logging, json, sys
          logging.basicConfig(level=logging.INFO, format="%(levelname)s %(message)s")

          sys.path.insert(0, ".")
          from src.agents.stake_agent import fetch_stake_odds, _get

          print("\n=== Raw /sport/tennis/category ===")
          data = _get("/sport/tennis/category")
          print(json.dumps(data, indent=2) if data else "NONE / unreachable")

          sample_players = [
              "Carlos Alcaraz", "Holger Rune", "Alexander Zverev",
              "Jannik Sinner", "Andrey Rublev", "Casper Ruud",
              "Stefanos Tsitsipas", "Taylor Fritz", "Alex de Minaur",
              "Cameron Norris",
          ]
          print("\n=== fetch_stake_odds() ===")
          odds = fetch_stake_odds(sample_players)
          if odds:
              print(json.dumps(odds, indent=2))
          else:
              print("No Stake odds returned (API unreachable or no matching fixtures)")
          EOF
